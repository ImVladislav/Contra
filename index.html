<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <title>Дев'ятий</title>
    <link rel="icon" href="assets/sprites/card-pirates.png" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/sprites/card-pirates.png"
    />
    <link rel="apple-touch-icon" href="assets/sprites/card-pirates.png" />

    <link rel="manifest" href="site.webmanifest" />
    <meta name="theme-color" content="#07131f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Дев'ятий" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        background: radial-gradient(circle at center, #18354a 0%, #07131f 70%);
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: none;
      }

      .game-viewport {
        width: min(100vw, 133.3333vh);
        height: min(100vh, 75vw);
        width: min(100vw, calc(100dvh * 4 / 3));
        height: min(100dvh, calc(100vw * 3 / 4));
        aspect-ratio: 4 / 3;
        flex: none; /* never squeezed by the other overlays in <body> */
        box-sizing: border-box;
        overflow: hidden;
        border-left: 4px solid #2d5d75;
        border-right: 4px solid #2d5d75;
        box-shadow:
          0 0 0 2px #091b29,
          0 0 40px rgba(0, 0, 0, 0.7);
      }

      .game-viewport canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* Phones/tablets already have the "Непереможний Дев'ятий" secret tap
         code as their god-mode toggle - the "Безсмертя" checkbox is a
         desktop-only debug control and just clutters the touch UI. */
      @media (pointer: coarse) {
        #game-godmode-checkbox {
          display: none !important;
        }
      }

      /* Phone in landscape: the game fills the screen (its width follows
         the phone's shape, sized by index.js) - no frame, no bars. */
      @media (pointer: coarse) and (orientation: landscape) {
        html,
        body {
          background: #000;
        }
        .game-viewport {
          aspect-ratio: auto;
          border: 0;
          box-shadow: none;
        }
      }

      .hero-intro {
        position: fixed;
        top: 18px;
        right: 18px;
        z-index: 20;
        pointer-events: none;
      }

      .hero-intro__card {
        display: flex;
        align-items: center;
        gap: 18px;
        width: min(88vw, 440px);
        padding: 18px 22px;
        border: 2px solid rgba(255, 209, 102, 0.7);
        border-radius: 18px;
        background: linear-gradient(
          135deg,
          rgba(11, 25, 37, 0.92),
          rgba(24, 53, 74, 0.84)
        );
        box-shadow: 0 14px 30px rgba(0, 0, 0, 0.5);
      }

      .hero-intro__portrait {
        display: grid;
        place-items: center;
        width: 72px;
        height: 72px;
        border: 2px solid #ffd166;
        border-radius: 16px;
        background: linear-gradient(180deg, #ffdd87, #c68010);
        color: #07131f;
        font:
          900 30px/1 Arial,
          sans-serif;
        box-shadow: inset 0 0 0 3px rgba(7, 19, 31, 0.2);
      }

      .hero-intro__body {
        display: flex;
        flex-direction: column;
        gap: 6px;
        color: #eaf4ff;
      }

      .hero-intro__name {
        font:
          900 26px/1.1 Arial,
          sans-serif;
        letter-spacing: 0.05em;
        color: #ffd166;
        text-transform: uppercase;
      }

      .hero-intro__text {
        font:
          500 18px/1.4 Arial,
          sans-serif;
        color: #dfeffb;
      }

      .touch-controls {
        display: none;
      }

      @media (pointer: coarse), (max-width: 800px) {
        .touch-controls {
          position: fixed;
          right: 0;
          bottom: 0;
          left: 0;
          z-index: 10;
          display: flex;
          align-items: flex-end;
          justify-content: space-between;
          padding: 12px max(14px, env(safe-area-inset-right))
            max(12px, env(safe-area-inset-bottom))
            max(14px, env(safe-area-inset-left));
          pointer-events: none;
          touch-action: none;
        }

        /* The real touch target is .touch-move-zone (the whole left half of
           the screen) - this is just the visual ring, so it can pop up
           wherever the finger actually landed instead of one fixed spot. */
        .touch-joystick {
          position: fixed;
          left: 20%;
          top: 80%;
          width: clamp(112px, 25vw, 168px);
          height: clamp(112px, 25vw, 168px);
          transform: translate(-50%, -50%);
          pointer-events: none;
          opacity: 0;
          transition: opacity 0.15s ease;
        }
        .touch-joystick.is-active {
          opacity: 1;
        }

        .touch-move-zone {
          position: absolute;
          left: 0;
          top: 0;
          bottom: 0;
          width: 58%;
          pointer-events: auto;
          touch-action: none;
        }

        .touch-actions {
          position: relative;
          width: clamp(160px, 35vw, 248px);
          height: clamp(112px, 25vw, 168px);
          margin-left: auto;
          pointer-events: auto;
        }

        .touch-stick {
          position: absolute;
          inset: 0;
          border: 2px solid rgba(255, 255, 255, 0.36);
          border-radius: 50%;
          background: radial-gradient(
            circle,
            rgba(65, 102, 119, 0.45),
            rgba(7, 19, 31, 0.4)
          );
          box-shadow:
            inset 0 0 0 10px rgba(7, 19, 31, 0.2),
            0 4px 12px rgba(0, 0, 0, 0.4);
          touch-action: none;
        }

        .touch-stick-knob {
          position: absolute;
          top: 50%;
          left: 50%;
          width: 42%;
          height: 42%;
          border: 2px solid #ffd166;
          border-radius: 50%;
          background: rgba(255, 209, 102, 0.78);
          box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
          transform: translate(-50%, -50%);
          pointer-events: none;
        }

        .touch-button {
          position: absolute;
          display: grid;
          place-items: center;
          box-sizing: border-box;
          width: clamp(42px, 11vw, 72px);
          height: clamp(42px, 11vw, 72px);
          border: 2px solid rgba(255, 255, 255, 0.48);
          border-radius: 50%;
          color: #ffffff;
          background: rgba(7, 19, 31, 0.45);
          box-shadow:
            inset 0 0 0 2px rgba(255, 209, 102, 0.12),
            0 4px 12px rgba(0, 0, 0, 0.4);
          font:
            700 clamp(11px, 2.7vw, 17px)/1 Arial,
            sans-serif;
          -webkit-tap-highlight-color: transparent;
          user-select: none;
          touch-action: none;
        }

        .touch-button.is-pressed,
        .touch-button:active {
          color: #07131f;
          background: #ffd166;
          filter: brightness(1.15);
        }

        .touch-actions .touch-button {
          width: clamp(48px, 12vw, 78px);
          height: clamp(48px, 12vw, 78px);
        }
        .touch-start {
          top: 0;
          left: 0;
        }
        .touch-pause {
          top: 0;
          right: 0;
        }
        .touch-jump {
          bottom: 0;
          left: 0;
        }
        .touch-fire {
          right: 0;
          bottom: 0;
          color: #ffd166;
          border-color: #ffd166;
        }
        .touch-jump,
        .touch-fire {
          background: rgba(7, 19, 31, 0.28);
        }
        .touch-actions .touch-jump,
        .touch-actions .touch-fire {
          width: clamp(56px, 15vw, 92px);
          height: clamp(56px, 15vw, 92px);
        }
      }

      /* Phone in landscape: the game now fills the screen, so keep the
         controls compact (sized by screen height) and out of the way. */
      @media (orientation: landscape) and (pointer: coarse) {
        .touch-controls {
          padding: 8px max(10px, env(safe-area-inset-right))
            max(8px, env(safe-area-inset-bottom))
            max(10px, env(safe-area-inset-left));
        }
        .touch-joystick {
          width: clamp(96px, 32vh, 150px);
          height: clamp(96px, 32vh, 150px);
        }
        .touch-actions {
          width: clamp(140px, 46vh, 220px);
          height: clamp(96px, 32vh, 150px);
        }
        .touch-button,
        .touch-actions .touch-button {
          width: clamp(40px, 14vh, 64px);
          height: clamp(40px, 14vh, 64px);
          font-size: clamp(10px, 3.2vh, 15px);
        }
        .touch-actions .touch-jump,
        .touch-actions .touch-fire {
          width: clamp(50px, 18vh, 80px);
          height: clamp(50px, 18vh, 80px);
          font-size: clamp(12px, 3.8vh, 17px);
        }
      }

      /* "Непереможний Дев'ятий" enabled (secret code on the touch buttons) */
      .cheat-modal {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: grid;
        place-items: center;
        background: rgba(0, 0, 0, 0.35);
        animation: cheat-fade 2.8s ease forwards;
      }
      .cheat-modal__card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        max-width: min(80vw, 420px);
        padding: 18px 24px;
        border: 2px solid #ffd166;
        border-radius: 16px;
        background: linear-gradient(
          135deg,
          rgba(11, 25, 37, 0.96),
          rgba(24, 53, 74, 0.92)
        );
        box-shadow: 0 0 30px rgba(255, 209, 102, 0.35);
        text-align: center;
      }
      .cheat-modal__icon {
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        border: 2px solid #ffd166;
        background: radial-gradient(circle, #ffe49a, #c68010);
        color: #07131f;
        font:
          900 30px/1 Arial,
          sans-serif;
      }
      .cheat-modal__title {
        font:
          900 20px/1.2 Arial,
          sans-serif;
        color: #ffd166;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .cheat-modal__text {
        font:
          500 15px/1.35 Arial,
          sans-serif;
        color: #dfeffb;
      }
      @keyframes cheat-fade {
        0% {
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        80% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }

      /* Phone/tablet held upright: a full-screen "rotate your phone" card with
         an animated phone turning sideways (covers the whole screen height). */
      .rotate-overlay {
        display: none;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        .rotate-overlay {
          position: fixed;
          top: 0;
          left: 0;
          z-index: 100;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 4vh;
          box-sizing: border-box;
          width: 100vw;
          height: 100vh;
          height: 100dvh;
          padding: max(24px, env(safe-area-inset-top)) 24px
            max(24px, env(safe-area-inset-bottom));
          background: radial-gradient(
            circle at 50% 40%,
            #18354a 0%,
            #07131f 75%
          );
          color: #dfeffb;
          text-align: center;
        }
        .rotate-overlay__art {
          width: min(70vw, 42vh);
          height: auto;
          max-height: 50vh;
        }
        .rotate-overlay__title {
          font:
            900 clamp(22px, 7vw, 34px) / 1.15 Impact,
            "Arial Black",
            Arial,
            sans-serif;
          letter-spacing: 0.06em;
          color: #ffd166;
          text-transform: uppercase;
          text-shadow: 0 2px 0 #000;
        }
        .rotate-overlay__text {
          max-width: 80vw;
          font:
            500 clamp(14px, 4.2vw, 18px) / 1.4 Arial,
            sans-serif;
          color: #a9c6d9;
        }
      }
      .rotate-phone {
        transform-box: fill-box;
        transform-origin: center;
        animation: rotate-phone 2.8s ease-in-out infinite;
      }
      .rotate-arrow {
        animation: rotate-arrow 2.8s ease-in-out infinite;
      }
      @keyframes rotate-phone {
        0%,
        18% {
          transform: rotate(0deg);
        }
        45%,
        78% {
          transform: rotate(-90deg);
        }
        100% {
          transform: rotate(0deg);
        }
      }
      @keyframes rotate-arrow {
        0%,
        12% {
          opacity: 0;
        }
        25%,
        45% {
          opacity: 1;
        }
        60%,
        100% {
          opacity: 0;
        }
      }

      /* no stick/buttons over the menus - the menu items are tapped */
      .touch-controls.is-menu {
        visibility: hidden;
      }
      .touch-controls.is-menu * {
        visibility: hidden;
      }

      /* the pause button is a small labelled pill */
      .touch-controls .touch-actions .touch-pause {
        top: 0;
        right: 0;
        width: auto;
        height: 34px;
        padding: 0 14px;
        border-radius: 999px;
        font-size: 13px;
        letter-spacing: 0.08em;
      }

      /* Phone in landscape: the radio card and the god-mode switch were far
         too big for a ~390px tall screen. */
      @media (orientation: landscape) and (pointer: coarse) {
        .hero-intro {
          top: 8px;
          right: auto;
          left: 50%;
          transform: translateX(-50%);
        }
        .hero-intro__card {
          width: min(60vw, 340px);
          gap: 10px;
          padding: 8px 12px;
          border-radius: 12px;
        }
        .hero-intro__portrait {
          width: 40px;
          height: 40px;
          border-radius: 10px;
        }
        .hero-intro__portrait img {
          height: 34px !important;
        }
        .hero-intro__body {
          gap: 2px;
        }
        .hero-intro__name {
          font-size: 15px;
        }
        .hero-intro__text {
          font-size: 12px;
          line-height: 1.3;
        }
        #game-godmode-checkbox {
          top: 8px !important;
          right: 8px !important;
          padding: 5px 9px !important;
          gap: 5px !important;
          font-size: 11px !important;
          border-radius: 8px !important;
        }
      }

      @media (orientation: portrait) and (pointer: coarse) {
        .game-viewport {
          position: absolute;
          top: 2vh;
          top: 2dvh;
          aspect-ratio: auto;
        }

        .touch-controls {
          display: none;
          padding-bottom: max(10px, env(safe-area-inset-bottom));
        }
      }
    </style>
  </head>
  <body>
    <div class="rotate-overlay" aria-live="polite">
      <svg class="rotate-overlay__art" viewBox="0 0 240 240" aria-hidden="true">
        <!-- curved "turn" arrow -->
        <g
          class="rotate-arrow"
          fill="none"
          stroke="#ffd166"
          stroke-width="7"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M 196 92 A 84 84 0 0 0 104 38" />
          <path d="M 118 24 L 102 38 L 118 52" />
        </g>
        <!-- the phone -->
        <g class="rotate-phone">
          <rect
            x="82"
            y="46"
            width="76"
            height="148"
            rx="14"
            fill="#0b1925"
            stroke="#dfeffb"
            stroke-width="6"
          />
          <rect x="91" y="62" width="58" height="112" rx="4" fill="#18354a" />
          <!-- a tiny game scene on the screen -->
          <rect x="91" y="140" width="58" height="34" fill="#1f6aa0" />
          <rect x="91" y="128" width="58" height="12" fill="#3c8a2e" />
          <path d="M 104 98 Q 120 78 136 98 Z" fill="#5d6b34" />
          <path
            d="M 106 98 L 120 116 L 134 98"
            fill="none"
            stroke="#dfeffb"
            stroke-width="1.5"
          />
          <text
            x="120"
            y="126"
            text-anchor="middle"
            font-family="Arial Black, Arial, sans-serif"
            font-weight="900"
            font-size="16"
            fill="#ffd166"
          >
            9
          </text>
          <rect x="108" y="182" width="24" height="4" rx="2" fill="#dfeffb" />
        </g>
      </svg>
      <div class="rotate-overlay__title">Поверніть телефон</div>
      <div class="rotate-overlay__text">
        Поверніть пристрій боком, щоб продовжити місію.
      </div>
    </div>
    <script src="src/index.js?v=9" type="module"></script>
  </body>
</html>
